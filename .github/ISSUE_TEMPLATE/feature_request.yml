# Personal feature-request template (installed from the dotclaude config
# repo to ~/.claude/templates/ISSUE_TEMPLATE/ by install.py), also used
# natively by GitHub for issues filed against the dotclaude repo itself.
# Keep it generic — it gets used in any project, not just this one.
name: Feature request
description: Propose a new feature or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today
      description: The gap this would close. Avoid jumping straight to the solution here.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd add or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Why not an existing feature, or a smaller change?
    validations:
      required: false
