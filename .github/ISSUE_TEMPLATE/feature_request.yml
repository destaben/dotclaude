name: Feature request
description: Propose a new agent, skill, command, or change to the pipeline.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today
      description: The gap this would close. Avoid jumping straight to the solution here.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd add or change — new agent/skill/command, or a change to an existing one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Why not an existing skill/agent, or a smaller change?
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this repo holds (confirm you've checked these)
      options:
        - label: No hooks — the change fits a command/skill sequence, not a tool-call hook.
        - label: No personal data (names, emails, absolute home paths, tokens) in any tracked file.
        - label: Keeps CLAUDE.md under 150 lines if it touches global rules.
