# Personal bug-report template (installed from the dotclaude config repo to
# ~/.claude/templates/ISSUE_TEMPLATE/ by install.py), also used natively by
# GitHub for issues filed against the dotclaude repo itself. Keep it generic
# — it gets used in any project, not just this one.
name: Bug report
description: Something behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs. what actually happened. Include exact error text if there is any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The minimal steps/command sequence that reproduces it.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Which part of the project this touches (free text — name the module, file, or feature).
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant file paths, line numbers, logs, or command output. Don't paste anything that might contain secrets or unrelated private context.
    validations:
      required: false
