name: docs-check

# Advisory only: reports structural issues (missing frontmatter, a stray
# "hooks" key, an oversized CLAUDE.md, a leaked email/path) without blocking
# merges. Local work never depends on this passing.

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run structural checks
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
