# Automatic PR review using the bug-hunter and documenter agents
# (.claude/agents/bug-hunter.md, .claude/agents/documenter.md).
#
# INACTIVE until you add a secret. Two auth options:
#   - CLAUDE_CODE_OAUTH_TOKEN (recommended for a personal repo): generate with
#     `claude setup-token`. Runs bill against your Claude subscription quota,
#     not pay-per-token API billing — confirmed at
#     https://code.claude.com/docs/en/github-actions. Tied to the account that
#     ran `claude setup-token`; fine here since this is a personal repo.
#   - ANTHROPIC_API_KEY: pay-per-token API billing, decoupled from your
#     subscription's weekly/session cap. Use this if CI review would otherwise
#     compete with your own interactive usage for the same quota — see
#     docs/decisions/0007-pro-plan-cost-sustainability.md.
#
# Runs on every PR (opened/synchronize/reopened), not just on an
# `@claude review` comment: see docs/decisions/0011-propagated-auto-pr-review.md,
# which narrows 0007's comment-only trigger now that the review runs on
# Haiku 5.5 at low effort — cheap enough per run that the per-push cost is
# acceptable against the shared subscription quota. The comment and manual
# triggers stay as a fallback.
name: claude-pr-review

on:
  issue_comment:
    types: [created]
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run bug-hunter and documenter review
        uses: anthropics/claude-code-action@v1
        with:
          # Pick exactly one of these two secrets; see the header comment.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's own token instead of the OIDC exchange for the
          # Claude GitHub App token, which needs `id-token: write` and the
          # app installed on the repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true # TEMP: diagnose Edit(/review.md) denial, remove
          claude_args: >-
            --model claude-haiku-5-5 --effort low
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git show:*),Read,Grep,Glob,Edit(/review.md)"
            --disallowedTools "Read(.git/**)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }}
            of this repository (HEAD is detached, so use this number with
            `gh pr view`/`gh pr diff`; run commands from the repo root with
            relative paths, no `git -C`). Review it using the bug-hunter agent defined in
            .claude/agents/bug-hunter.md and the severity definitions in
            .claude/skills/release-policy/SKILL.md. Then run the documenter
            agent defined in .claude/agents/documenter.md to check whether
            docs need updating for this change. Post the combined findings
            as Markdown in `review.md`; a later workflow step posts that file as the
            PR comment. If there are no findings, write a short note saying so
            instead of leaving it empty.
            In this run you can read the code and write one file, `review.md`;
            you cannot edit anything else, run tests (CI already runs them),
            or post to GitHub. The documenter reports only, and the
            bug-hunter reviews the diff without running the suite.
            Run the agents in the foreground and wait for their results: this
            is a non-interactive run that ends when you stop, so do not end
            your turn until `review.md` is written.

      # The agent never talks to GitHub's write API: it writes review.md and
      # this step posts it, so a prompt-injected diff cannot make the agent
      # run `gh pr comment` with arbitrary content. A workflow_dispatch run
      # has no PR number, so there is nothing to post to and it is skipped.
      - name: Post the review
        if: always() && (github.event.pull_request.number || github.event.issue.number)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -s review.md ]; then
            gh pr comment "$PR_NUMBER" --body-file review.md
          else
            echo "review.md missing or empty; nothing to post"
          fi

# Before relying on this workflow, re-check the action's current input names
# (`claude_code_oauth_token`, `anthropic_api_key`, `prompt`, `claude_args`)
# against https://code.claude.com/docs/en/github-actions — this was
# scaffolded from documentation current as of 2026-10-17 and the action may
# have moved on.
#
# To reuse this in a DIFFERENT repo: this file itself (project-specific CI)
# and .claude/agents/{bug-hunter,documenter}.md + .claude/skills/release-policy/
# must all be committed into that repo. A GitHub Actions runner only checks
# out the target repo, not your ~/.claude — user-scope install isn't visible
# to it. Run `python3 scripts/install.py --mode project --target <path-to-that-repo>`
# from this dotclaude repo to install the agents/skills there, then copy this
# workflow file in too. `destaben/github-config`'s `apply.sh` automates the
# `CLAUDE_CODE_OAUTH_TOKEN` secret for every public repo tagged with the
# `github-config` topic, but not the agent/skill files or this workflow file
# itself — those still need `install.py --mode project` plus a manual copy
# per target repo.
