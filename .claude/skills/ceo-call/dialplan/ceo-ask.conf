; Outbound "ask" call used by a software agent. It is started by a call file that sets CEO_ID and
; CEO_OPTIONS; the agent has already stored the spoken prompts in the per-call spool folder.
; The answer is recorded only after a second key press confirms it.
[ceo-ask]
exten => s,1,NoOp(Ask call ${CEO_ID})
 same => n,GotoIf($[${REGEX("^[0-9a-f]+$" ${CEO_ID})} = 0]?bad)
 same => n,GotoIf($[${REGEX("^[1-8]$" ${CEO_OPTIONS})} = 0]?bad)
 same => n,Set(CEO_DIR=/var/spool/asterisk/ceo/${CEO_ID})
 same => n,Answer()
 same => n,Set(FILE(${CEO_DIR}/answered)=1)
 same => n,Wait(1)
 same => n,Set(ROUND=0)
 same => n(ask),Set(ROUND=$[${ROUND} + 1])
 same => n,GotoIf($[${ROUND} > 3]?giveup)
 ; One key: a number picks an option, 9 repeats, anything else or silence asks again.
 same => n,Read(CHOICE,${CEO_DIR}/prompt,1,,1,20)
 same => n,GotoIf($[${REGEX("^[1-8]$" ${CHOICE})} = 0]?ask)
 same => n,GotoIf($[${CHOICE} > ${CEO_OPTIONS}]?ask)
 same => n,Read(CONFIRM,${CEO_DIR}/confirm_${CHOICE},1,,1,15)
 same => n,GotoIf($["${CONFIRM}" != "1"]?ask)
 same => n,Set(FILE(${CEO_DIR}/result)=${CHOICE})
 same => n,Playback(${CEO_DIR}/thanks)
 same => n,Hangup()
 same => n(giveup),Set(FILE(${CEO_DIR}/result)=undecided)
 same => n,Playback(${CEO_DIR}/giveup)
 same => n,Hangup()
 same => n(bad),Hangup()

exten => h,1,GotoIf($[${REGEX("^[0-9a-f]+$" ${CEO_ID})} = 0]?end)
 same => n,Set(FILE(/var/spool/asterisk/ceo/${CEO_ID}/done)=1)
 same => n(end),NoOp()
